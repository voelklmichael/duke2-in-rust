[package]
name = "dn2_desktop"
version = "0.1.0"
description = "Runs the Duke Nukem II engine in a desktop window"
edition.workspace = true
publish.workspace = true

[dependencies]
dn2_engine.workspace = true
winit = "0.30"
softbuffer = "0.4"
clap = { version = "4", features = ["derive"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
png = "0.18"
cpal = "0.17"
